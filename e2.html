<!doctype html>
<html>
    <head>
        <!-- Load Blockly core -->
        <script src="./src/packages/blockly/blockly_compressed.js"></script>
        <!-- Load the default blocks -->
        <script src="./src/packages/blockly/blocks_compressed.js"></script>
        <!-- Load a generator -->
        <script src="./src/packages/blockly/javascript_compressed.js"></script>
        <!-- Load a message file -->
        <script src="./src/packages/blockly/msg/en.js"></script>

        <script src="./src/packages/jquery.min.js"></script>
        
        <script type="module">
            /*
                I would have this in a seperate file,
                but I'm developing this on a Chromebook
                which is managed by my school,
                and it does not like combining src
                with type="module" and I can't just
                run a webserver to get around that
                as the Linux VM tools are blocked
            */
            import {javascriptGenerator} from './src/packages/blockly/javascript.js';

            $(function(){
                // Create toolbox
                var toolbox = {
                    "kind": "categoryToolbox",
                    "contents": [
                        {
                            "kind": "category",
                            "name": "Control",
                            "contents": [
                                {
                                    "kind": "block",
                                    "type": "controls_if"
                                },
                            ]
                        },
                        {
                            "kind": "category",
                            "name": "Logic",
                            "contents": [
                                {
                                    "kind": "block",
                                    "type": "logic_compare"
                                },
                                {
                                    "kind": "block",
                                    "type": "logic_operation"
                                },
                                {
                                    "kind": "block",
                                    "type": "logic_boolean"
                                }
                            ]
                        }
                    ]
                };
                // Inject Blockly into the Blockly div
                const workspace = Blockly.inject('blocklyDiv',{
                    oneBasedIndex:true,
                    toolbox:toolbox
                })
                $('#generateCode').on('click',function(){
                    $('#generatedCode').val(javascriptGenerator.workspaceToCode(workspace))
                })
            })
        </script>
    </head>
    <body>
        <button id="generateCode">Generate</button>
        <div id="blocklyDiv" style="height: 480px; width: 600px;"></div>
        <textarea id="generatedCode" readonly placeholder="Generated code will go here..."></textarea>
    </body>
</html>
